services:
  app:
    build: 
      context: .
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ${HOME}/.azure:/home/appuser/.azure
    command: uvicorn ml_api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - app-network

  migrate:
    build:
      context: .
      target: dev
    command: alembic upgrade head
    user: "${UID}:${GID}"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - app-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_MEMORY_LIMIT_MB=1024
    mem_limit: 1536m
    ports:
      - "1433:1433"
    networks:
      - app-network
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD} -C -Q 'SELECT 1' || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  app-network:
    driver: bridge
services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ${HOME}/.azure:/home/appuser/.azure
    command: uvicorn ml_api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - app-network

  migrate:
    build:
      context: .
      target: dev
    command: alembic upgrade head
    user: "${UID}:${GID}"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - app-network

  sqlserver:
    # Pin to a specific version to avoid surprise breaking changes from :latest
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_MEMORY_LIMIT_MB=1024
    mem_limit: 1536m
    ports:
      - "1433:1433"
    networks:
      - app-network
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      # Give SQL Server time to fully initialize before the first health probe.
      # Without this, early failures burn through retries before the process is
      # even ready, and the container is marked unhealthy too soon.
      start_period: 30s

networks:
  app-network:
    driver: bridge
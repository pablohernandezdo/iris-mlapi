[project]
name = "basic-structure"
version = "0.1.0"
description = "FastApi basic structure"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.28.0",
    "fastapi>=0.136.1",
    "gunicorn>=26.0.0",
    "joblib>=1.5.3",
    "pydantic-settings>=2.14.0",
    "pyodbc>=5.3.0",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.46.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "debugpy>=1.8.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

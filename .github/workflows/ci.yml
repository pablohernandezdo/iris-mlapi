name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── 1. Unit tests ─────────────────────────────────────────────────────────
  # Fast feedback — no Docker, no external services. Runs first to fail early.
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run unit tests
        run: uv run pytest src/tests/unit/ -v -p no:cacheprovider
        env:
          PYTHONPATH: src

  # ── 2. Build & push test image ────────────────────────────────────────────
  # Builds the `test` Docker stage and pushes it to ghcr.io so the integration
  # and e2e jobs can pull the exact same image without rebuilding.
  build:
    needs: test-unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          target: test
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ── 3a. Integration tests ─────────────────────────────────────────────────
  # Uses all three compose files:
  #   docker-compose.yml       → base topology (app, migrate, sqlserver, network)
  #   docker-compose.ci.yml    → CI overrides (test image target, no volumes)
  #   docker-compose.test.yml  → routes DB_URL → TEST_DB_URL (ml_api_test)
  #
  # All docker compose calls in this job share COMPOSE_FILE so every service
  # lands on the same Compose-managed network and can resolve each other by
  # service name (e.g. "sqlserver").
  test-integration:
    needs: build
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml:docker-compose.test.yml
      MODEL_BLOB_URL: placeholder
      ENV: ci
      APP_NAME: SampleMLAPI

    steps:
      - uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          printf '%s\n' \
            'DB_PASSWORD=${{ secrets.TEST_DB_PASSWORD }}' \
            'DB_URL=mssql+pyodbc://sa:${{ secrets.TEST_DB_PASSWORD }}@sqlserver:1433/ml_api?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes' \
            'TEST_DB_URL=mssql+pyodbc://sa:${{ secrets.TEST_DB_PASSWORD }}@sqlserver:1433/ml_api_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes' \
            'MODEL_BLOB_URL=placeholder' \
            'ENV=ci' \
            'APP_NAME=SampleMLAPI' \
            > .env

      - name: Start SQL Server
        run: docker compose up -d sqlserver

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T sqlserver \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "${{ secrets.TEST_DB_PASSWORD }}" \
              -Q "SELECT 1" -C 2>/dev/null \
            && echo "SQL Server ready" && break
            echo "Waiting... ($i/30)" && sleep 5
          done

      - name: Run migrations
        run: docker compose run --rm migrate

      - name: Run integration tests
        run: docker compose run --rm app python -m pytest src/tests/integration/ -v -p no:cacheprovider

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  # ── 3b. End-to-end tests ──────────────────────────────────────────────────
  # Uses only the base + CI compose files (no docker-compose.test.yml), so the
  # app hits the normal ml_api database — the same path as production.
  # _download_model is patched in e2e/conftest.py — no Azure credentials needed.
  test-e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      MODEL_BLOB_URL: placeholder
      ENV: ci
      APP_NAME: SampleMLAPI

    steps:
      - uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          printf '%s\n' \
            'DB_PASSWORD=${{ secrets.TEST_DB_PASSWORD }}' \
            'DB_URL=mssql+pyodbc://sa:${{ secrets.TEST_DB_PASSWORD }}@sqlserver:1433/ml_api?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes' \
            'MODEL_BLOB_URL=placeholder' \
            'ENV=ci' \
            'APP_NAME=SampleMLAPI' \
            > .env

      - name: Start SQL Server
        run: docker compose up -d sqlserver

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T sqlserver \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "${{ secrets.TEST_DB_PASSWORD }}" \
              -Q "SELECT 1" -C 2>/dev/null \
            && echo "SQL Server ready" && break
            echo "Waiting... ($i/30)" && sleep 5
          done

      - name: Run migrations
        run: docker compose run --rm migrate

      - name: Run e2e tests
        run: docker compose run --rm app python -m pytest src/tests/e2e/ -v -p no:cacheprovider

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  # ── 4. Deploy ─────────────────────────────────────────────────────────────
  # Runs on pushes to main only, after both test suites pass.
  # Builds the prod image, runs migrations against the production DB, then
  # updates the Container App to the new image revision.
  deploy:
    needs: [test-integration, test-e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/ml-api:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push production image to ACR
        run: |
          az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}
          docker build --target prod \
            -t $IMAGE \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/ml-api:latest \
            .
          docker push --all-tags ${{ secrets.ACR_LOGIN_SERVER }}/ml-api

      # Migrations run before the new revision is activated so the schema is
      # always ahead of (or equal to) the running app version.
      - name: Run migrations
        run: |
          docker run --rm \
            -e DB_URL="${{ secrets.PROD_DB_URL }}" \
            -e MODEL_BLOB_URL=placeholder \
            -e ENV=prod \
            -e APP_NAME=SampleMLAPI \
            $IMAGE \
            alembic upgrade head

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image $IMAGE
services:
  app:
    build:
      context: .
      # Use the test stage (prod + dev tools + src/tests/) instead of dev,
      # so CI runs against the baked image rather than the mounted source tree.
      target: test
    volumes: []          # Remove local source mount — use what's baked into the image
    user: ""             # Remove local UID/GID override — irrelevant inside CI containers

  migrate:
    build:
      context: .
      target: prod       # Migrations run from the prod image in CI
    volumes: []          # Remove local source mount
    user: ""             # Remove local UID/GID override